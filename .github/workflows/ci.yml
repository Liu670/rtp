name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          go build ./...
          go vet ./...

      - name: Cross-compile smoke test
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/rtpc
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/rtpc
